<!DOCTYPE html>
<html>
<head>
    <title>HTML Formatting Example</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>HTML Formatting</h1>
    <p>This line contains <b>bold</b>, <i>italics</i>, and <u>underline</u>.</p>
    <p style="color: blue;">This text is blue in color.</p>
    <p style="color: red; font-weight: bold;">This text is red and bold.</p>
    <hr>
    <h2>This is a Comparision to Headings! </h2>
    <h1>Computer Science</h1>
    <h2>Internet</h2>
    <h3>Web Development</h3>
    <marquee>This is the end of HTML Formatting!</marquee>
</body>
</html>
