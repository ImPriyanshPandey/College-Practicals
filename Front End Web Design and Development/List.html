function factorial(n) {
  if (n === 0 || n === 1) {
    return 1;
  } else {
    return n * factorial(n - 1);
  }
}

// Example: Calculate factorial of 5
var numberToFindFactorial = 5;
var result = factorial(numberToFindFactorial);

console.log("Factorial of", numberToFindFactorial, "is:", result);
