<!DOCTYPE html>
<html lang="en">

<head>
  <title>Factorial Finder</title>
</head>

<body>

  <label for="factorialInput">Enter a number:</label>
  <input type="number" id="factorialInput">
  <button onclick="findFactorial()">Find Factorial</button>

  <p id="result"></p>

  <script>
    function factorial(n) {
      if (n === 0 || n === 1) {
        return 1;
      } else {
        return n * factorial(n - 1);
      }
    }

    function findFactorial() {
      var inputNumber = document.getElementById("factorialInput").value;
      var result = factorial(parseInt(inputNumber));
      document.getElementById("result").innerText = "Factorial is: " + result;
    }
  </script>

</body>

</html>
